name: pre-commit
on:
  push:
    branches-ignore:
      - wip/**
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # For more info, see:
  # https://docs.github.com/en/actions/using-jobs/using-concurrency
  # https://docs.github.com/en/actions/learn-github-actions/contexts
  group: >-
    concurrency-group::${{ github.workflow }}::${{
      github.event.pull_request.number > 0
      && format('pr-{0}', github.event.pull_request.number)
      || github.ref_name
    }}${{
      github.ref_name == 'main'
      && format('::{0}', github.run_id)
      || ''
    }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      SKIP: >-
        bazel-test-all
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # the hooks (and prek itself) come from the nix/ dev shell
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Run prek
        run: nix develop path:./nix --command prek run --all-files --show-diff-on-failure
